name: Regression Suite

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  regression:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm install -g allure-commandline

      - run: npm run regression:ci

      # Copy regression report
      - run: mkdir -p deploy/regression && cp -r allure-report/regression/* deploy/regression/

      # Index page
      - run: |
          cat > deploy/index.html << 'EOF'
          <html><body style="font-family: Arial; text-align: center; padding: 50px;">
          <h1>Test Reports</h1>
          <p><a href="smoke/">📊 Smoke Report</a></p>
          <p><a href="regression/">📊 Regression Report</a></p>
          </body></html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - id: deployment
        uses: actions/deploy-pages@v4