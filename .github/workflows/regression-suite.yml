name: Regression Suite

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  regression:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm install -g allure-commandline

      # -------- SMOKE REPORT --------
      - name: Run Smoke Tests
        run: npm run smoke

      - name: Generate Smoke Report
        run: npx allure generate allure-results --clean -o allure-report/smoke

      # -------- REGRESSION REPORT --------
      - name: Clean before regression
        run: rm -rf allure-results

      - name: Run Regression Tests
        run: npm run regression

      - name: Generate Regression Report
        run: npx allure generate allure-results --clean -o allure-report/regression

      # -------- MERGE REPORTS --------
      - name: Prepare deploy folder
        run: |
          mkdir -p deploy/smoke
          mkdir -p deploy/regression
          cp -r allure-report/smoke/* deploy/smoke/
          cp -r allure-report/regression/* deploy/regression/

      # -------- INDEX PAGE --------
      - name: Create index page
        run: |
          cat > deploy/index.html << 'EOF'
          <html>
          <body style="font-family: Arial; text-align: center; padding: 50px;">
          <h1>Test Reports</h1>
          <p><a href="smoke/">📊 Smoke Report</a></p>
          <p><a href="regression/">📊 Regression Report</a></p>
          </body>
          </html>
          EOF

      # -------- DEPLOY --------
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4